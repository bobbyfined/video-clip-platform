version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: videoclip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: video_clip
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: videoclip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 抖音/TikTok 视频解析服务（绕过反爬，需要填 Cookie）
  # B站/YouTube/快手等由后端 yt-dlp 处理，不需要此服务
  scraper:
    image: evil0ctal/douyin_tiktok_download_api
    container_name: videoclip-scraper
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./scraper-config/douyin_config.yaml:/app/crawlers/douyin/web/config.yaml
    environment:
      TZ: Asia/Shanghai

  backend:
    build: ./backend
    container_name: videoclip-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/video_clip?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
      DB_USER: root
      DB_PASS: root
      LLM_MIMO_API_KEY: ${LLM_MIMO_API_KEY}
      SCRAPER_URL: http://scraper:9000
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      scraper:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: videoclip-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  storage_data:
